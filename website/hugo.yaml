baseURL: "https://lown.pages.dev/"
locale: "en-us"
title: "lown"
theme: "ecosystem"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: "base16-snazzy"
    noClasses: false

menu:
  main:
    - name: "Docs"
      url: "/docs/"
      weight: 1
    - name: "Changelog"
      url: "/changelog/"
      weight: 2

params:
  version: "v0.3.0"
  description: "User-space package manager for Linux and macOS"
  tagline: "User-space package manager"
  github: "https://github.com/iamvxrn/lown"

  # Flexible Feature Configuration Toggles
  features:
    enable_changelog: true
    enable_comparison: true
    enable_showcase: true
    enable_ai_disclosure: true
    install_command: "curl -fsSL https://lown.pages.dev/install.sh | sh"

  # Community & Repository Links
  social:
    github: "https://github.com/iamvxrn/lown"
    releases: "https://github.com/iamvxrn/lown/releases"
    license: "https://github.com/iamvxrn/lown/blob/main/LICENSE"

disableKinds: ["taxonomy", "term"]
