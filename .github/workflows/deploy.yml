name: Register Deployment Status

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Production Deployment (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lown.pages.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Register Active Deployment Status
        run: echo "Lown documentation deployed to https://lown.pages.dev"
